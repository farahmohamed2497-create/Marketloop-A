<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarketLoop Agent Chat</title><link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <aside><h1>MarketLoop</h1><p>Choose an agent</p><nav id="agents" aria-label="Agents"></nav></aside>
    <section class="chat"><header><h2 id="agent-title">Select an agent</h2><span id="status"></span></header>
      <div id="messages" aria-live="polite"></div>
      <form id="composer"><input id="message" aria-label="Message" placeholder="Write a message" required><button>Send</button></form>
    </section>
  </main><script src="/static/app.js"></script>
</body>
</html>
